```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Interest Calculator</title>
</head>

<body>

    <h1>Simple Interest Calculator</h1>

    <form action="/calculate" method="POST">

        <label for="p">Principal:</label>
        <input type="number" id="p" name="p" step="any" required>

        <br><br>

        <label for="r">Rate:</label>
        <input type="number" id="r" name="r" step="any" required>

        <br><br>

        <label for="t">Time:</label>
        <input type="number" id="t" name="t" step="any" required>

        <br><br>

        <button type="submit">Calculate</button>

    </form>


    {% if result is not none %}

        <hr>

        <h3>Result:</h3>

        <p>Principal: {{ p }}</p>

        <p>Rate: {{ r }}</p>

        <p>Time: {{ t }}</p>

        <p>
            <b>Simple Interest: {{ result }}</b>
        </p>

        <p>
            <b>Total Amount: {{ total }}</b>
        </p>

    {% endif %}

</body>

</html>
```
